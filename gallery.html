<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gallery — Yunfei Yu</title>
  <meta name="description" content="Photographs by Yunfei Yu, as a waterfall of light: every thread is a stream of photographs.">
  <meta property="og:title" content="Gallery — Yunfei Yu">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#03040a">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261001zc">
  <link rel="stylesheet" href="assets/css/undertow.css?v=20261001zc">
  <link rel="stylesheet" href="assets/css/gallery.css?v=20261001zc">
</head>
<body class="gallery-page">
  <!-- the site's bar, on the dark waterfall -->
  <header class="bar" id="bar">
    <a class="brand" href="index.html" aria-label="Home">Yunfei Yu</a>
    <nav aria-label="Primary" id="bar-nav">
      <a href="index.html#/work" data-t="work"></a>
      <a href="gallery.html" data-t="gallery" aria-current="page"></a>
      <a href="index.html#/method" data-t="method"></a>
      <a href="index.html#/about" data-t="about"></a>
    </nav>
    <div class="right">
      <a href="index.html#/contact" data-t="contact"></a>
      <button class="lang" id="lang" type="button" aria-label="Switch language">中文</button>
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="bar-nav"><span></span><span></span></button>
    </div>
  </header>

  <!-- Undertow by Haichao Li (MIT licence, see assets/js/undertow/LICENSE), with Yunfei's photographs -->
  <canvas id="stream" tabindex="0" aria-label="A curtain of light made of Yunfei Yu's photographs. Every thread is a stream of photographs. Use left and right arrows to move between threads and Enter to open one. Scroll or pinch to zoom."></canvas>
  <p id="error" role="alert" hidden></p>
  <div id="loader" aria-hidden="true"><i></i></div>
  <div id="meter" aria-hidden="true"><i></i></div>
  <div id="cursor" aria-hidden="true"></div>
  <p id="announce" class="sr-only" aria-live="polite"></p>
  <!-- a quiet guide for first-time visitors, and zoom buttons -->
  <p class="wf-hint" id="wf-hint"></p>
  <div class="wf-zoom" aria-label="Zoom"><button type="button" id="wf-out" aria-label="Zoom out">−</button><button type="button" id="wf-in" aria-label="Zoom in">+</button></div>

  <section id="story" role="dialog" aria-modal="true" aria-labelledby="story-title" hidden>
    <div class="story-backdrop" aria-hidden="true"></div>
    <button class="story-side prev" type="button" aria-label="Previous thread"></button>
    <button class="story-side next" type="button" aria-label="Next thread"></button>
    <div class="story-thread" aria-hidden="true"></div>
    <div class="story-flow"><div class="strip"></div></div>
    <button class="story-back" type="button" aria-label="Back to the waterfall">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>
    </button>
    <p class="story-title" id="story-title"></p>
    <div class="lightbox" hidden>
      <img alt="">
      <p class="lb-cap"></p>
    </div>
  </section>

  <noscript><p style="padding:96px 24px;color:#e4e7f6">This page needs JavaScript. Contact: phineasyu0812@gmail.com</p></noscript>
  <script src="assets/js/gallery-data.js?v=20261001zc"></script>
  <script>
    /* the bar's labels and the language switch (the waterfall itself has no text to translate) */
    (function () {
      var N = { work: ["Work", "作品"], gallery: ["Gallery", "摄影"], method: ["Method", "方法"], about: ["About", "关于"], contact: ["Contact", "联系"] };
      var lang = "en"; try { lang = localStorage.getItem("lang") === "zh" ? "zh" : "en"; } catch (e) {}
      var touch = matchMedia("(pointer: coarse)").matches;
      var HINT = touch ? ["Tap a thread, or pinch to zoom in", "点一条线，或双指放大"] : ["Click a thread, or zoom in", "点击一条线，或放大查看"];
      var zoom = function (d) { if (window.__undertow) window.__undertow.zoomBy(d, innerWidth / 2, innerHeight / 2); };
      document.getElementById("wf-in").addEventListener("click", function () { zoom(0.7); });
      document.getElementById("wf-out").addEventListener("click", function () { zoom(-0.7); });
      function paint() { document.getElementById("wf-hint").textContent = HINT[lang === "zh" ? 1 : 0]; document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = N[el.dataset.t][lang === "zh" ? 1 : 0]; }); document.getElementById("lang").textContent = lang === "zh" ? "EN" : "中文"; document.documentElement.lang = lang; }
      document.getElementById("lang").addEventListener("click", function () { lang = lang === "zh" ? "en" : "zh"; try { localStorage.setItem("lang", lang); } catch (e) {} paint(); });
      paint();
    })();
  </script>
  <script type="module" src="assets/js/undertow/app.js?v=20261001zc"></script>
  <script src="assets/js/menu.js?v=20261001zc"></script>
</body>
</html>
