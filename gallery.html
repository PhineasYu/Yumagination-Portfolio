<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Yunfei Yu</title>
  <meta name="description" content="Photographs by Yunfei Yu. A side project.">
  <meta property="og:title" content="Gallery — Yunfei Yu">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f4f4f4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Crect x='16' width='16' height='32' fill='%2381d8d0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261001g">
  <link rel="stylesheet" href="assets/css/gallery.css?v=20261001g">
</head>
<body class="gallery-page">
  <a class="skip" href="#cv">Skip to the photographs</a>

  <header class="bar" id="bar">
    <a class="brand" href="index.html" aria-label="Home">Yunfei Yu</a>
    <nav aria-label="Primary">
      <a href="index.html#/work" data-t="work"></a>
      <a href="gallery.html" data-t="gallery" aria-current="page"></a>
      <a href="index.html#/method" data-t="method"></a>
      <a href="index.html#/about" data-t="about"></a>
    </nav>
    <div class="right">
      <a href="index.html#/contact" data-t="contact"></a>
      <button class="lang" id="lang" type="button" aria-label="Switch language">中文</button>
    </div>
  </header>

  <main id="cv" class="cv" aria-label="Photographs on an endless canvas. Drag to move.">
    <div id="world" class="world"><div id="title" class="g-title-card"></div></div>
  </main>
  <div class="g-hud">
    <p id="hint" class="g-hint mono"><span></span></p>
    <p id="count" class="g-count mono"></p>
    <div class="g-spec" id="spec" hidden>
      <span class="g-spec-n mono" id="spec-n"></span>
      <div class="g-spec-track" id="spec-track" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="360"><span class="g-spec-ticks" id="spec-ticks" aria-hidden="true"></span><span class="g-spec-knob" id="spec-knob" aria-hidden="true"></span></div>
      <button class="g-spec-all" id="spec-all" type="button"></button>
    </div>
    <div class="g-btns"><button id="zout" class="g-home" type="button" aria-label="Zoom out">&minus;</button><button id="zin" class="g-home" type="button" aria-label="Zoom in">+</button><button id="home" class="g-home" type="button">&#8634;</button></div>
  </div>

  <div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden>
    <button class="lb-close" id="lb-close" type="button" aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous photograph">←</button>
    <figure class="lb-fig"><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
    <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="Next photograph">→</button>
    <div class="lb-count mono" id="lb-count"></div>
  </div>

  <noscript><p style="padding:96px 24px">This page needs JavaScript. Contact: phineasyu0812@gmail.com</p></noscript>

  <script src="assets/js/gallery-data.js?v=20261001g"></script>
  <script src="assets/js/gallery.js?v=20261001g"></script>
</body>
</html>
