<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intro animation — prototype</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f4f4f4; --ink: #111; --muted: #4d4d4d; --tf: #81d8d0; --ease: cubic-bezier(.22, .61, .36, 1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
    .stage { position: fixed; inset: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* viewfinder: the visitor is in Yunfei's frame */
    .vf { position: absolute; inset: clamp(20px, 6vmin, 64px); pointer-events: none; opacity: 0; transform: scale(1.12); transition: opacity 420ms var(--ease), transform 520ms var(--ease); }
    .vf.on { opacity: 1; transform: none; }
    .vf.snap { transform: scale(.975); transition-duration: 90ms; }
    .vf.off { opacity: 0; transition-duration: 700ms; }
    .vf i { position: absolute; width: clamp(28px, 5vmin, 56px); height: clamp(28px, 5vmin, 56px); border: 0 solid var(--ink); }
    .vf i:nth-child(1) { left: 0; top: 0; border-width: 3px 0 0 3px; border-top-left-radius: 10px; }
    .vf i:nth-child(2) { right: 0; top: 0; border-width: 3px 3px 0 0; border-top-right-radius: 10px; }
    .vf i:nth-child(3) { left: 0; bottom: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 10px; }
    .vf i:nth-child(4) { right: 0; bottom: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 10px; }
    .vf b { position: absolute; left: 50%; top: 42%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
    .vf b::before, .vf b::after { content: ""; position: absolute; background: var(--ink); }
    .vf b::before { left: 10px; top: 0; width: 2px; height: 22px; }
    .vf b::after { top: 10px; left: 0; height: 2px; width: 22px; }

    /* the flash starts at the lens and fills the screen */
    .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; opacity: 0; clip-path: circle(0 at var(--fx, 50%) var(--fy, 50%)); }
    .flash.pop { opacity: 1; clip-path: circle(160% at var(--fx, 50%) var(--fy, 50%)); transition: clip-path 160ms cubic-bezier(.3, 0, .2, 1), opacity 40ms linear; }
    .flash.fade { opacity: 0; clip-path: circle(160% at var(--fx, 50%) var(--fy, 50%)); transition: opacity 1400ms var(--ease); }

    .title { position: absolute; left: clamp(20px, 7vw, 120px); top: clamp(88px, 16vh, 180px); opacity: 0; transform: translateY(12px); transition: opacity 700ms var(--ease), transform 700ms var(--ease); pointer-events: none; }
    .title.on { opacity: 1; transform: none; }
    .title h1 { margin: 0; font-weight: 600; font-size: clamp(52px, 9vw, 150px); line-height: .92; letter-spacing: -.05em; }
    .title p { margin: 20px 0 0; font-size: clamp(18px, 1.8vw, 26px); font-weight: 500; letter-spacing: -.015em; line-height: 1.3; }
    .title p span { display: block; color: var(--muted); }

    .ui { position: absolute; right: clamp(16px, 3vw, 32px); bottom: clamp(16px, 3vw, 32px); display: flex; gap: 10px; }
    .ui button, .ui a { font: 600 14px/1 "Instrument Sans", sans-serif; padding: 11px 18px; border-radius: 999px; border: 1px solid rgba(17,17,17,.14); background: rgba(255,255,255,.85); color: var(--ink); cursor: pointer; text-decoration: none; backdrop-filter: blur(8px); }
    .ui a { background: var(--ink); color: #fff; border-color: var(--ink); }
    .ui [hidden] { display: none; }
    @media (max-width: 600px) { .note { display: none; } }
    .note { position: absolute; left: 16px; top: 12px; margin: 0; font-size: 12px; color: var(--muted); opacity: .8; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="c" aria-label="Animated crowd that parts for Yunfei, who takes a photo"></canvas>
    <div class="vf" id="vf" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="title" id="title">
      <h1>Yunfei Yu</h1>
      <p>From ambiguous problem to working prototype.<span>Built with AI I direct and verify.</span></p>
    </div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="ui">
      <button type="button" id="skip">Skip</button>
      <button type="button" id="replay" hidden>Replay</button>
      <a href="index.html" id="enter" hidden>Enter portfolio →</a>
    </div>
    <p class="note">Prototype · crowd: Open Peeps by Pablo Stanley (CC0), walk adapted from Skiper UI 39</p>
  </div>

<script>
/* Intro prototype. One continuous sequence, no clicks:
   crowd walks → crowd parts and thins → Yunfei steps in → raises the camera (viewfinder frames the visitor)
   → shutter: white flash from the lens → flash fades → the line art has picked up soft colour → title.
   Crowd walk follows Skiper UI 39 / zadvorsky's canvas crowd, rewritten without React or GSAP. */
(function () {
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const vf = document.getElementById("vf"), flash = document.getElementById("flash"), title = document.getElementById("title");
  const skipBtn = document.getElementById("skip"), replayBtn = document.getElementById("replay"), enterBtn = document.getElementById("enter");
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FREEZE = +(new URLSearchParams(location.search).get("freeze") || 0);   // review aid: ?freeze=5000 stops the clock at 5 s

  // timeline (ms)
  const T = { part: 2200, enter: 3700, raise: 4700, press: 5650, shot: 5800, title: 6700 };
  const PALETTE = ["#81D8D0", "#FF9A8B", "#FFE07A", "#9CC9F5", "#F7B8CF", "#FFC6A5"];
  const SHEET = { cols: 15, rows: 7 };

  const load = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; });
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
  const easeInOut = (t) => { t = clamp01(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const mixWhite = (hex, k) => { const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; const m = (c) => Math.round(c + (255 - c) * k); return `rgb(${m(r)},${m(g)},${m(b)})`; };

  let sheet, meLine, meColor, cellW, cellH, W = 0, H = 0, dpr = 1, s = 1;
  let watched = {}, maxWatchers = 0, peeps = [], t = 0, last = 0, colored = false, spawnOn = true, parting = false, raf = 0, after = { next: 0 }, fired = {};

  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    s = Math.max(150, Math.min(H * .38, 340)) / cellH;   // peep height ≈ 38% of the screen
  }

  /* ---------- crowd ---------- */
  function makePeep(i, anywhere) {
    const w = cellW * s, h = cellH * s, dir = Math.random() > .5 ? 1 : -1;
    const offsetY = (100 - 250 * Math.pow(Math.random(), 2)) * s;
    const p = { i, sx: (i % SHEET.cols) * cellW, sy: ((i / SHEET.cols) | 0) * cellH, w, h, dir,
      speed: Math.max(W, 900) / 10 * rand(.5, 1.5), phase: rand(0, 1), baseY: H - h + offsetY,
      x: dir > 0 ? -w : W, tint: null, color: PALETTE[i % PALETTE.length], leaving: false };
    if (anywhere) p.x = rand(-w, W);
    if (colored) paint(p);
    return p;
  }
  function paint(p) {   // soft colour: multiply a pale tone into the white fill, keep the black lines
    const c = document.createElement("canvas"); c.width = Math.ceil(p.w * dpr); c.height = Math.ceil(p.h * dpr);
    const x = c.getContext("2d");
    x.drawImage(sheet, p.sx, p.sy, cellW, cellH, 0, 0, c.width, c.height);
    x.globalCompositeOperation = "multiply"; x.fillStyle = mixWhite(p.color, .35); x.fillRect(0, 0, c.width, c.height);
    x.globalCompositeOperation = "destination-in"; x.drawImage(sheet, p.sx, p.sy, cellW, cellH, 0, 0, c.width, c.height);
    p.tint = c;
  }
  const unused = () => { const used = new Set(peeps.map((p) => p.i)); const free = []; for (let i = 0; i < SHEET.cols * SHEET.rows; i++) if (!used.has(i)) free.push(i); return free[(Math.random() * free.length) | 0]; };
  const crowdSize = () => Math.max(24, Math.min(105, Math.round(W / 13)));

  /* ---------- the sequence ---------- */
  function reset() {
    cancelAnimationFrame(raf);
    t = 0; last = 0; colored = false; spawnOn = true; parting = false; fired = {}; after = { next: 0 }; watched = { "-1": 0, "1": 0 }; maxWatchers = Math.max(4, Math.round(W / 130));
    peeps = [];
    const n = crowdSize();
    for (let k = 0; k < n; k++) peeps.push(makePeep(unused(), true));
    vf.className = "vf"; title.className = "title"; flash.className = "flash";
    skipBtn.hidden = false; replayBtn.hidden = true; enterBtn.hidden = true;
    raf = requestAnimationFrame(frame);
  }

  function once(key, fn) { if (!fired[key]) { fired[key] = true; fn(); } }

  const zone = () => { const r = meLine.naturalWidth / meLine.naturalHeight; return Math.min(H * .74 * r, W * .46) * .72; };
  function lensPoint(f) { return { x: f.x + f.w * .97, y: f.y + f.h * .655 }; }
  function figure() {
    const ratio = meLine.naturalWidth / meLine.naturalHeight;
    let h = Math.min(H * .74, (W * .92) / ratio), w = h * ratio;
    const k = easeOut((t - T.enter) / 750);                       // step in: rise + fade
    const raise = easeInOut((t - T.raise) / 650);                  // raise: lean in, a little larger
    const press = t > T.press && t < T.shot + 120 ? Math.sin(clamp01((t - T.press) / 270) * Math.PI) : 0;
    const scale = 1 + raise * .045 + press * .012;
    w *= scale; h *= scale;
    // after the photo: settle beside the title (right of it on wide screens, smaller under it on phones)
    const settle = easeInOut((t - (T.title - 500)) / 1000), wide = W >= 900;
    const endH = Math.min(wide ? H * .64 : H * .5, h), endCx = wide ? W * .68 : W / 2;
    h += (endH - h) * settle; w = h * ratio;
    const cxNow = W / 2 + raise * w * .02, cxF = cxNow + (endCx - cxNow) * settle;
    const x = cxF - w / 2, y = H - h + (1 - k) * h * .14 + raise * -h * .02 * (1 - settle);
    return { x, y, w, h, alpha: k, rot: raise * -.025 * (1 - settle) };
  }

  function frame(now) {
    const dt = last ? Math.min(50, now - last) : 16; last = now;
    if (FREEZE) { while (t < FREEZE) tick(16); } else tick(dt);
    draw();
    raf = requestAnimationFrame(frame);
  }

  function tick(dt) {
    t += dt;
    const cx = W / 2;

    // phase triggers
    if (t > T.part) once("part", () => { spawnOn = false; parting = true; });
    if (t > T.raise) once("vf", () => vf.classList.add("on"));
    if (t > T.press) once("snap", () => vf.classList.add("snap"));
    if (t > T.shot) once("shot", shot);
    if (t > T.title) once("title", () => { title.classList.add("on"); skipBtn.hidden = true; replayBtn.hidden = false; enterBtn.hidden = false; });

    // move crowd
    const partK = easeOut((t - T.part) / 900);
    for (const p of peeps) {
      if (parting && !p.leaving) {   // everyone turns toward the nearer edge; a few stop at the sides and watch
        const side = p.x + p.w / 2 < cx ? -1 : 1;
        p.dir = side; p.leaving = true; p.partSpeed = (W / 2 + p.w) / 1.5 * rand(.85, 1.25);
        if (watched[side] < maxWatchers / 2 && Math.random() < .35) {
          const edge = side < 0 ? cx - zone() - p.w : cx + zone();
          const far = side < 0 ? rand(-p.w * .3, edge) : rand(edge, W - p.w * .7);
          p.stopAt = side < 0 ? Math.min(far, edge, p.x) : Math.max(far, edge, p.x); watched[side]++;
        }
      }
      if (p.stopped) { p.phase = 0; continue; }
      const v = p.leaving ? p.speed + (p.partSpeed - p.speed) * partK : p.speed;
      p.x += p.dir * v * dt / 1000;
      p.phase += dt / 500;
      if (p.stopAt != null && (p.dir < 0 ? p.x <= p.stopAt : p.x >= p.stopAt)) { p.x = p.stopAt; p.stopped = true; p.dir = -p.dir; }   // turn round to face the middle
    }
    // remove walkers that left; respawn while the crowd is on, or as the sparse coloured crowd afterwards
    peeps = peeps.filter((p) => {
      const out = p.dir > 0 ? p.x > W : p.x < -p.w;
      return !out;
    });
    if (spawnOn) while (peeps.length < crowdSize()) peeps.push(makePeep(unused(), false));
    if (colored && t > after.next && peeps.length < Math.round(crowdSize() * .3)) {
      const p = makePeep(unused(), false); p.speed *= .8; peeps.push(p); after.next = t + rand(500, 1100);
    }

  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    peeps.sort((a, b) => a.baseY - b.baseY);
    const f = t > T.enter ? figure() : null;
    for (const p of peeps) {
      const y = p.baseY - Math.abs(Math.sin(p.phase * Math.PI)) * 10 * s;
      ctx.save(); ctx.translate(p.x, y);
      if (p.dir < 0) { ctx.translate(p.w, 0); ctx.scale(-1, 1); }
      if (p.tint) ctx.drawImage(p.tint, 0, 0, p.w, p.h); else ctx.drawImage(sheet, p.sx, p.sy, cellW, cellH, 0, 0, p.w, p.h);
      ctx.restore();
    }
    if (f) {
      ctx.save(); ctx.globalAlpha = f.alpha;
      ctx.translate(f.x + f.w / 2, f.y + f.h); ctx.rotate(f.rot); ctx.translate(-f.w / 2, -f.h);
      ctx.drawImage(colored ? meColor : meLine, 0, 0, f.w, f.h);
      ctx.restore();
    }
  }

  function shot() {
    const f = figure(), l = lensPoint(f);
    flash.style.setProperty("--fx", `${(l.x / W) * 100}%`); flash.style.setProperty("--fy", `${(l.y / H) * 100}%`);
    flash.classList.add("pop");
    setTimeout(() => {           // under full white: the world picks up colour
      colored = true; peeps.forEach(paint);
      vf.classList.remove("snap"); vf.classList.add("off");
    }, 170);
    setTimeout(() => { flash.classList.remove("pop"); flash.classList.add("fade"); }, 330);
  }

  function skipToEnd() {
    t = T.title + 1; fired = { part: 1, vf: 1, snap: 1, shot: 1 }; parting = false; spawnOn = false;
    colored = true; peeps = peeps.filter((p) => p.stopped || Math.abs(p.x + p.w / 2 - W / 2) > zone() + p.w / 2).slice(0, Math.max(4, Math.round(W / 130))); peeps.forEach((p) => { p.leaving = true; p.stopped = true; p.dir = p.x + p.w / 2 < W / 2 ? 1 : -1; paint(p); });
    vf.className = "vf"; flash.className = "flash";
  }

  skipBtn.addEventListener("click", skipToEnd);
  replayBtn.addEventListener("click", reset);
  addEventListener("resize", () => { size(); peeps = peeps.map((p) => makePeep(p.i, true)); });
  document.addEventListener("visibilitychange", () => { last = 0; });

  Promise.all([load("assets/intro/peeps.png"), load("assets/intro/yunfei-line.png"), load("assets/intro/yunfei-color.png")]).then(([a, b, c]) => {
    sheet = a; meLine = b; meColor = c;
    cellW = sheet.naturalWidth / SHEET.cols; cellH = sheet.naturalHeight / SHEET.rows;
    size(); reset();
    if (REDUCE) skipToEnd();
  });
})();
</script>
</body>
</html>
