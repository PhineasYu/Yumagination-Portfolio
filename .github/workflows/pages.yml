name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main, claude/nice-archimedes-v6dri5]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # publish only the website: the pages, their assets and the embedded demos (not docs/, scripts/, CLAUDE.md, …)
      - name: Collect the site
        run: |
          mkdir _site
          cp index.html gallery.html _site/
          cp -R assets demos _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
